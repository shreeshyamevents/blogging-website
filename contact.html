<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Me | My Personal Journal</title>
    <meta name="description" content="Get in touch with me directly through this contact form.">

    <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/2545/2545603.png">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        :root { --bg: #fcfbf9; --text: #2d3142; --primary: #8c2f39; --card-bg: #ffffff; --border: #e5e5e5; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: var(--bg); color: var(--text); font-family: 'Plus Jakarta Sans', sans-serif; line-height: 1.8; font-size: 18px; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        header { text-align: center; padding: 40px 0 20px; border-bottom: 2px solid var(--border); margin-bottom: 30px; }
        header h1 { font-family: 'Playfair Display', serif; font-size: 3rem; color: var(--primary); }
        nav { text-align: center; margin-top: 15px; }
        nav a { margin: 0 15px; text-decoration: none; color: var(--text); font-weight: 600; }
        nav a.active { color: var(--primary); border-bottom: 2px solid var(--primary); }
        .contact-card { background: var(--card-bg); padding: 40px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .contact-card h2 { font-family: 'Playfair Display', serif; color: var(--primary); margin-bottom: 15px; }
        input, textarea { width: 100%; padding: 12px; margin: 8px 0 20px; border: 1px solid var(--border); border-radius: 6px; font-family: inherit; font-size: 16px; }
        button { background: var(--primary); color: white; border: none; padding: 12px 25px; border-radius: 6px; cursor: pointer; font-size: 16px; font-weight: 600; transition: background 0.3s; }
        button:hover { background: #6b232b; }
        footer { text-align: center; padding: 30px 0; margin-top: 40px; border-top: 1px solid var(--border); font-size: 0.9rem; color: #888; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>My Daily Journal</h1>
            <p>Stories, Experiences & Thoughts</p>
            <nav>
                <a href="index.html">Home</a>
                <a href="about.html">About Me</a>
                <a href="contact.html" class="active">Contact</a>
            </nav>
        </header>

        <main class="contact-card">
            <h2>Get in Touch</h2>
            <!-- Formspree Integration -->
            <form action="https://formspree.io/f/YOUR_FORMSPREE_ID_HERE" method="POST">
                <label for="name">Your Name</label>
                <input type="text" id="name" name="name" placeholder="Enter your name" required>

                <label for="email">Your Email</label>
                <input type="email" id="email" name="_replyto" placeholder="Enter your email" required>

                <label for="message">Your Message</label>
                <textarea id="message" name="message" rows="5" placeholder="Write your message here..." required></textarea>

                <button type="submit">Send Message</button>
            </form>
        </main>

        <footer>
            <p>© 2026 My Personal Journal | All Rights Reserved</p>
        </footer>
    </div>
</body>
</html>
